<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Grid-forming versus grid-following inverter control</title>
  <desc id="desc">Side-by-side original comparison of reference generation, cascaded control, plant behavior, synchronization, and typical application of grid-forming and grid-following inverters.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
    <style>
      .title{font:700 32px Arial,sans-serif;fill:#0f172a}.sub{font:16px Arial,sans-serif;fill:#475569}
      .ph{font:700 26px Arial,sans-serif}.h{font:700 18px Arial,sans-serif;fill:#0f172a}.t{font:15px Arial,sans-serif;fill:#334155}.small{font:14px Arial,sans-serif;fill:#475569}
      .panel{fill:#fff;stroke-width:3}.gfm{stroke:#2563eb}.gfl{stroke:#7c3aed}.b1{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.b2{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}
      .plant{fill:#f8fafc;stroke:#64748b;stroke-width:2}.l1{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#a1)}.l2{fill:none;stroke:#7c3aed;stroke-width:2.5;marker-end:url(#a2)}
      .fb1{fill:none;stroke:#0891b2;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a1)}.fb2{fill:none;stroke:#a855f7;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a2)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="58" class="title">Grid-forming and grid-following control</text>
  <text x="70" y="87" class="sub">Different reference sources and system roles; both use fast inner current regulation</text>

  <rect x="45" y="120" width="640" height="640" rx="20" class="panel gfm"/>
  <text x="75" y="165" class="ph" fill="#1d4ed8">GRID-FORMING (GFM)</text>
  <text x="75" y="195" class="sub">Establishes the local voltage waveform and frequency</text>
  <rect x="85" y="235" width="230" height="82" rx="12" class="b1"/>
  <text x="112" y="267" class="h">Internal reference</text><text x="112" y="294" class="t">P-f / Q-V droop or setpoint</text>
  <rect x="395" y="235" width="230" height="82" rx="12" class="b1"/>
  <text x="430" y="267" class="h">Outer voltage loop</text><text x="430" y="294" class="t">Vdq* -> Idq*</text>
  <path d="M315 276H395" class="l1"/>
  <rect x="85" y="365" width="230" height="82" rx="12" class="b1"/>
  <text x="118" y="397" class="h">Inner current loop</text><text x="118" y="424" class="t">Idq* -> Vdq*</text>
  <path d="M510 317V344H200V365" class="l1"/>
  <rect x="395" y="365" width="230" height="82" rx="12" class="plant"/>
  <text x="420" y="397" class="h">PWM + VSI + LC filter</text><text x="420" y="424" class="t">Voltage-source plant</text>
  <path d="M315 406H395" class="l1"/>
  <rect x="235" y="500" width="280" height="68" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="283" y="530" class="h">Islanded / weak AC bus</text><text x="306" y="552" class="small">V and f established by GFM</text>
  <path d="M510 447V500" class="l1"/>
  <path d="M235 534H150V447" class="fb1"/><text x="105" y="491" class="small">Vdq, Idq</text>
  <line x1="80" y1="605" x2="650" y2="605" stroke="#dbeafe" stroke-width="2"/>
  <text x="95" y="638" class="h">Behavior</text><text x="225" y="638" class="t">Controlled voltage source</text>
  <text x="95" y="670" class="h">Synchronizer</text><text x="225" y="670" class="t">Internal angle / droop dynamics</text>
  <text x="95" y="702" class="h">Best suited to</text><text x="225" y="702" class="t">Islanded operation and weak-grid support</text>

  <rect x="715" y="120" width="640" height="640" rx="20" class="panel gfl"/>
  <text x="745" y="165" class="ph" fill="#6d28d9">GRID-FOLLOWING (GFL)</text>
  <text x="745" y="195" class="sub">Synchronizes to an established voltage waveform</text>
  <rect x="755" y="235" width="230" height="82" rx="12" class="b2"/>
  <text x="803" y="267" class="h">Power references</text><text x="803" y="294" class="t">P* and Q* -> Idq*</text>
  <rect x="1065" y="235" width="230" height="82" rx="12" class="b2"/>
  <text x="1098" y="267" class="h">Inner current loop</text><text x="1098" y="294" class="t">Idq* -> Vdq*</text>
  <path d="M985 276H1065" class="l2"/>
  <rect x="755" y="365" width="230" height="82" rx="12" class="b2"/>
  <text x="824" y="397" class="h">PLL</text><text x="793" y="424" class="t">Grid voltage -> theta, omega</text>
  <rect x="1065" y="365" width="230" height="82" rx="12" class="plant"/>
  <text x="1090" y="397" class="h">PWM + VSI + filter</text><text x="1090" y="424" class="t">Current-controlled plant</text>
  <path d="M1180 317V365" class="l2"/>
  <rect x="905" y="500" width="280" height="68" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="955" y="530" class="h">Established AC grid</text><text x="948" y="552" class="small">External waveform supplies V and f</text>
  <path d="M1180 447V500" class="l2"/>
  <path d="M905 534H870V447" class="fb2"/><text x="785" y="491" class="small">Grid Vabc</text>
  <path d="M870 365V335H1010V276H1065" class="l2"/><text x="887" y="329" class="small">theta for dq frame</text>
  <line x1="750" y1="605" x2="1320" y2="605" stroke="#ede9fe" stroke-width="2"/>
  <text x="765" y="638" class="h">Behavior</text><text x="895" y="638" class="t">Controlled current source</text>
  <text x="765" y="670" class="h">Synchronizer</text><text x="895" y="670" class="t">PLL locks to grid voltage</text>
  <text x="765" y="702" class="h">Best suited to</text><text x="895" y="702" class="t">Power injection into an energized grid</text>

  <rect x="350" y="778" width="700" height="30" rx="10" fill="#e2e8f0"/>
  <text x="407" y="799" class="small">Shared design principle: controller bandwidths are separated from the switching frequency.</text>
</svg>
